# ==============================================================================
# Weather HTTP Bridge → UNS
# ==============================================================================
# Polls the weather REST API simulator every 30 seconds and publishes
# each field as a separate _raw tag in the UNS.
#
# Target topic: umh.v1.mycompany.factory1.weather._raw.*
# API endpoint: http://95.217.14.139:8084/api/weather/current
#
# Tags: temperature_c, humidity_pct, wind_speed_kmh, cloud_cover_pct,
#        solar_irradiance_wm2, condition, pressure_hpa
# ==============================================================================

input:
  generate:
    interval: "30s"
    mapping: |
      root = ""

pipeline:
  processors:
    # Fetch weather data from REST API
    - http:
        url: "http://95.217.14.139:8084/api/weather/current"
        verb: GET

    # Fan out: convert JSON object into array of {tag_name, value} pairs
    - bloblang: |
        let data = this
        let tags = ["temperature_c", "humidity_pct", "wind_speed_kmh", "cloud_cover_pct", "solar_irradiance_wm2", "condition", "pressure_hpa"]
        root = $tags.map_each(tag -> {
          "tag_name": tag,
          "value": $data.get(tag).catch(null),
          "timestamp_ms": now().ts_unix_milli()
        }).filter(item -> item.value != null)

    - unarchive:
        format: json_array

    # Set UNS metadata for routing
    - bloblang: |
        meta location_path = "mycompany.factory1.weather"
        meta data_contract = "_raw"
        meta tag_name = this.tag_name
        root.value = this.value
        root.timestamp_ms = this.timestamp_ms

output:
  uns: {}
