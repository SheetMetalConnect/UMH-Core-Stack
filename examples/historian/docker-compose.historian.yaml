# ==============================================================================
# UMH Historian Addon
# ==============================================================================
# Adds TimescaleDB + Grafana to UMH Core stack
# Based on: https://docs.umh.app/production/deployment/docker-compose/setup
#
# Usage: docker compose -f docker-compose.yaml -f examples/historian/docker-compose.historian.yaml up -d
#
# Extension: Includes schema initialization (asset, tag, tag_string tables)
# Official UMH provides empty database - schema is user responsibility
# ==============================================================================

services:
  # ============================================================================
  # TimescaleDB - Time-Series Database
  # ============================================================================
  timescaledb:
    image: management.umh.app/oci/timescale/timescaledb:2.24.0-pg17
    container_name: timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-umh}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - TIMESCALEDB_TELEMETRY=off
      - TS_TUNE_MEMORY=${TS_TUNE_MEMORY:-4GB}
      - TS_TUNE_NUM_CPUS=${TS_TUNE_NUM_CPUS:-2}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./configs/timescaledb-init:/docker-entrypoint-initdb.d:ro
    networks:
      - timescaledb-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h timescaledb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # PgBouncer - Connection Pooling
  # ============================================================================
  pgbouncer:
    image: docker.io/edoburu/pgbouncer:v1.24.1-p1
    container_name: pgbouncer
    restart: unless-stopped
    environment:
      - DB_NAME=${POSTGRES_DB:-umh}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - DB_HOST=timescaledb
      - AUTH_TYPE=scram-sha-256
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h pgbouncer"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - default
      - timescaledb-network

  # ============================================================================
  # Grafana - Visualization Platform
  # ============================================================================
  grafana:
    image: management.umh.app/oci/grafana/grafana:12.3.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-umh}
      - HISTORIAN_READER_USER=${HISTORIAN_READER_USER:-grafanareader}
      - HISTORIAN_READER_PASSWORD=${HISTORIAN_READER_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://grafana:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks:
      - default

# ==============================================================================
# Networks
# ==============================================================================
networks:
  timescaledb-network:
    internal: true

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  timescaledb-data:
    driver: local
  grafana-data:
    driver: local
