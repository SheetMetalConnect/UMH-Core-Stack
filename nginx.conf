# ============================================================================
# NGINX Reverse Proxy for UMH Core (HTTP)
# ============================================================================
# This file is mounted to: /etc/nginx/conf.d/default.conf
# Update the proxy_pass target to match your http_server port in UMH.
# ============================================================================

server {
  listen 80;
  server_tokens off;

  # Add CORS headers globally for this server
  add_header 'Access-Control-Allow-Origin' '*' always;
  add_header 'Access-Control-Allow-Methods' 'POST,GET,HEAD,OPTIONS' always;
  add_header 'Access-Control-Allow-Headers' 'content-type' always;

  # Handle OPTIONS requests
  if ($request_method = 'OPTIONS') {
    return 204;
  }

  location /webhook/ {
    # docker exposes the service `umh` as a hostname
    # set the port to the http_server input port in UMH
    proxy_pass http://umh:8040;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

